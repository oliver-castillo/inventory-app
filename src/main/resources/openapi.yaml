openapi: 3.1.0
info:
  title: My service
  description: My service
  version: 1.0.0
servers:
  - url: 'http://localhost:8080/api/v1'
paths:
  /users:
    post:
      summary: Create user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    UserBase:
      type: object
      properties:
        firstName:
          type: string
          example: 'John'
        lastName:
          type: string
          example: 'Doe'
        email:
          type: string
          example: 'test@example.com'
      required:
        - firstName
        - lastName
        - email
    UserRequest:
      allOf:
        - $ref: '#/components/schemas/UserBase'
        - type: object
          properties:
            password:
              type: string
              example: 'securePassword123'
          required:
            - password
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/UserBase'
        - type: object
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example:
            - 'Email already exists'
            - 'User not found'