openapi: 3.1.0
info:
  title: My service
  description: My service
  version: 1.0.0
servers:
  - url: 'http://localhost:8080'
paths:
  /users:
    post:
      summary: Create user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

components:
  schemas:
    User:
      type: object
      properties:
        firstName:
          type: string
          example: 'John'
          pattern: ''
        lastName:
          type: string
          example: 'Doe'
        email:
          type: string
          example: 'test@example.com'
      required:
        - firstName
        - lastName
        - email
    UserRequest:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            password:
              type: string
              example: 'securePassword123'
          required:
            - password